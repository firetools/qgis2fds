[pytest]
# Run the complete suite by default; either directory can still be selected.
testpaths = tests/unit tests/integration
pythonpath = .. tests/unit tests/integration
# FDS tests are opt-in; an explicit command-line marker overrides this default.
addopts = --strict-markers -ra -m "not fds"
# Custom pytest setting, read by tests/conftest.py 
# Use native QGIS:
# qgis_process = /usr/bin/qgis_process
# Use flatpak QGIS:
qgis_process = flatpak run --command=qgis_process org.qgis.qgis
# Leave empty to delete generated quantitative cases after each test. Set a
# path to retain every generated project, input layer, and FDS output instead.
# Relative paths are resolved from the repository root.
quantitative_cases_directory =
# FDS executable used by the separate optional FDS integration tests:
fds = fds
markers =
    qgis: runs generated layers through the production QGIS Processing algorithm
    integration: runs installed QGIS and qgis2fds
    fds: exports a temporary case and runs it through optional FDS validation
