[pytest]
# Run the complete suite by default; either directory can still be selected.
testpaths = tests/unit tests/integration
pythonpath = .. tests/unit tests/integration
addopts = --strict-markers -ra
# Custom pytest setting, read by tests/conftest.py 
# Use native QGIS:
# qgis_process = /usr/bin/qgis_process
# Use flatpak QGIS:
qgis_process = flatpak run --command=qgis_process org.qgis.qgis
markers =
    integration: runs an installed QGIS application and qgis2fds plugin
